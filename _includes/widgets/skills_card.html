{% if site.data.profile.skills %}
<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <div class="row px-3 pt-3">
                    <div class="col h3">
                        Skills
                    </div>
                </div>
                <div class="row p-3" data-masonry='{"percentPosition": true }'>
                    {% for group in site.data.profile.skills %}
                    <div class="col-lg-4">
                        <div class="mx-2 my-1">
                            <h6>{{ group.category }}</h6>
                            <ul class="list small pl-3 mb-1">
                                {% for item in group.items %}
                                <li class="mb-1">
                                    <strong>{{ item.name }}:</strong> {{ item.description }}
                                </li>
                                {% endfor %}
                            </ul>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
{% endif %}
